<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacSync — every Mac, set up the same</title>
<meta name="description" content="MacSync keeps your Macs set up the same way: one Dock, the same apps, settings, config files, AI setup and developer tools, through your own iCloud Drive. Free and open source.">
<meta property="og:title" content="MacSync — every Mac, set up the same">
<meta property="og:description" content="One Dock, the same apps, settings and files on every Mac, through your own iCloud Drive. Free and open source.">
<meta property="og:image" content="assets/window-dark.png">
<meta name="theme-color" content="#0a7cff">
<link rel="icon" href="assets/favicon.png">
<script>try{var t=localStorage.getItem("macsync.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark";else document.documentElement.dataset.theme="light"}catch(e){}</script>
</head>

<div id="root"><!--app--></div>
<script type="module" src="/src/main.jsx"></script>
</body>
